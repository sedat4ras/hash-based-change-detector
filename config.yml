# FIM Configuration
# -----------------

# Directories to monitor (list of paths)
monitored_paths:
  - monitored_files

# Glob patterns to exclude from monitoring
exclude_patterns:
  - "*.log"
  - "*.tmp"
  - "*.swp"
  - "__pycache__/*"
  - "*.pyc"

# Files matching these patterns are classified as CRITICAL severity
critical_patterns:
  - "*.conf"
  - "*.cfg"
  - "*.env"
  - "*.pem"
  - "*.key"
  - "*shadow*"
  - "*passwd*"
  - "*.htpasswd"
  - "authorized_keys"

# Polling interval in seconds
polling_interval: 5

# Baseline file path
baseline_file: baseline.txt

# Log directory
log_dir: logs
